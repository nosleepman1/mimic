# mimic.yaml - Declarative API Mock Definition
# Run: mimic serve -f mimic.yaml --port=8080 --latency=200ms

endpoints:
  # 1. Stateful CRUD Users Resource
  - path: /api/v1/users
    method: GET
    summary: "List all users"
    resource: users
    is_crud: true

  - path: /api/v1/users
    method: POST
    summary: "Create a new user"
    resource: users
    is_crud: true
    status: 201

  - path: /api/v1/users/{id}
    method: GET
    summary: "Retrieve user by ID"
    resource: users
    is_crud: true

  - path: /api/v1/users/{id}
    method: PUT
    summary: "Update user by ID"
    resource: users
    is_crud: true

  - path: /api/v1/users/{id}
    method: DELETE
    summary: "Delete user"
    resource: users
    is_crud: true
    status: 204

  # 2. Custom Payload / Static Response
  - path: /api/v1/auth/login
    method: POST
    summary: "Authenticate user"
    status: 200
    response:
      token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
      token_type: "Bearer"
      expires_in: 86400

  # 3. Payments with Localized XOF Currency & Senegalese Phone Numbers
  - path: /api/v1/payments/mobile-money
    method: POST
    summary: "Initiate Wave or Orange Money transaction"
    status: 200
    schema:
      type: object
      properties:
        transaction_id:
          type: uuid
        customer_name:
          type: name
        phone_number:
          type: phone_sn
        amount:
          type: currency_xof
        status:
          type: string
          enum: ["SUCCESS", "PENDING"]
        created_at:
          type: date_iso
